<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>공지사항</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/notice.css" />
</head>
<body>
  <div class="app">
    <!-- 왼쪽 메뉴 -->
    <aside class="sidebar">
      <button class="profile" type="button" aria-label="계정 메뉴">
        <div class="avatar">
          <img src="icons/user.svg" alt="" />
        </div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">이름</div>
          <div class="profile-sub" id="profile-sub">학번</div>
        </div>
        <img class="chevron" src="icons/chevron-down.svg" alt="" />
      </button>

      <nav class="nav">
        <a href="layout.html">
          <img src="icons/home.svg" alt="" />
          <span>대시보드</span>
        </a>
        <a href="calendar.html">
          <img src="icons/calendar.svg" alt="" />
          <span>캘린더</span>
        </a>
        <a href="todo.html">
          <img src="icons/todo.svg" alt="" />
          <span>할 일</span>
        </a>
        <a href="notice.html" class="active">
          <img src="icons/notice.svg" alt="" />
          <span>공지사항</span>
        </a>
        <a href="settings.html">
          <img src="icons/settings.svg" alt="" />
          <span>설정</span>
        </a>
      </nav>
    </aside>

    <!-- 메인 영역: 페이지별 내용이 들어갈 자리 -->
    <main class="main" id="main">
      <header class="page-header">
        <h1 class="page-title">공지사항</h1>
        <div class="search">
          <input class="search-input" id="search-input" type="search" placeholder="공지 제목 검색" aria-label="공지 제목 검색" hidden />
          <button class="icon-btn" id="search-btn" type="button" aria-label="공지 검색">
            <img src="icons/search.svg" alt="" />
          </button>
        </div>
      </header>

      <section class="card">
        <!-- data-src: 출처별 공지 주소, 공백으로 구분 -->
        <div class="tabs" role="tablist">
          <button class="tab active" type="button" data-tab="all">전체</button>
          <button class="tab" type="button" data-tab="college" data-src="https://ai.ssu.ac.kr/board/notice">단과대</button>
          <button class="tab" type="button" data-tab="pr" data-src="https://scatch.ssu.ac.kr/%EA%B3%B5%EC%A7%80%EC%82%AC%ED%95%AD/">홍보센터</button>
          <button class="tab" type="button" data-tab="insta" data-src="https://www.instagram.com/soongsil1897/embed/ https://www.instagram.com/focussu.66th/embed/ https://www.instagram.com/ai_soongsil/embed/ https://www.instagram.com/ssu_aisw/embed/ https://www.instagram.com/ssu_it_dept/embed/">인스타</button>
        </div>

        <!-- 전체 공지 모음: 출처마다 가장 최신 공지 하나씩 (인스타는 계정마다 하나) -->
        <!-- TODO: 서버에서 최신 공지 받아서 표시 -->
        <ul class="notice-list" id="notice-list">
          <li class="notice-item">
            <span class="badge">홍보센터</span>
            <a class="notice-title" target="_blank" rel="noopener">불러오는 중</a>
            <span class="notice-date"></span>
            <p class="notice-desc"></p>
          </li>
          <li class="notice-item">
            <span class="badge">단과대</span>
            <a class="notice-title" target="_blank" rel="noopener">불러오는 중</a>
            <span class="notice-date"></span>
            <p class="notice-desc"></p>
          </li>
          <li class="notice-item">
            <span class="badge">인스타</span>
            <a class="notice-title" target="_blank" rel="noopener">불러오는 중</a>
            <span class="notice-date"></span>
            <p class="notice-desc"></p>
          </li>
          <li class="notice-item">
            <span class="badge">인스타</span>
            <a class="notice-title" target="_blank" rel="noopener">불러오는 중</a>
            <span class="notice-date"></span>
            <p class="notice-desc"></p>
          </li>
          <li class="notice-item">
            <span class="badge">인스타</span>
            <a class="notice-title" target="_blank" rel="noopener">불러오는 중</a>
            <span class="notice-date"></span>
            <p class="notice-desc"></p>
          </li>
          <li class="notice-item">
            <span class="badge">인스타</span>
            <a class="notice-title" target="_blank" rel="noopener">불러오는 중</a>
            <span class="notice-date"></span>
            <p class="notice-desc"></p>
          </li>
          <li class="notice-item">
            <span class="badge">인스타</span>
            <a class="notice-title" target="_blank" rel="noopener">불러오는 중</a>
            <span class="notice-date"></span>
            <p class="notice-desc"></p>
          </li>
        </ul>

        <!-- 단과대, 홍보센터, 인스타: 원본 페이지 iframe -->
        <div class="notice-frames" id="notice-frames" hidden></div>
      </section>
    </main>
  </div>

  <script src="scripts/notice.js"></script>
</body>
</html>
