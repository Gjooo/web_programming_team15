<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>할 일</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/planner.css">
  <script defer src="scripts/planner.js"></script>
</head>
<body>
  <div class="app">
    <!-- 왼쪽 메뉴 -->
    <aside class="sidebar">
      <button class="profile" type="button" aria-label="계정 메뉴">
        <div class="avatar">
          <img src="icons/user.svg" alt="" />
        </div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">이름</div>
          <div class="profile-sub" id="profile-sub">학번</div>
        </div>
        <img class="chevron" src="icons/chevron-down.svg" alt="" />
      </button>

      <nav class="nav">
        <a href="layout.html" aria-label="대시보드">
          <img src="icons/home.svg" alt="" />
          <span>대시보드</span>
        </a>
        <a href="calendar.html" aria-label="캘린더">
          <img src="icons/calendar.svg" alt="" />
          <span>캘린더</span>
        </a>
        <a href="todo.html" class="active" aria-current="page" aria-label="할 일">
          <img src="icons/todo.svg" alt="" />
          <span>할 일</span>
        </a>
        <a href="notice.html" aria-label="공지사항">
          <img src="icons/notice.svg" alt="" />
          <span>공지사항</span>
        </a>
        <a href="settings.html" aria-label="설정">
          <img src="icons/settings.svg" alt="" />
          <span>설정</span>
        </a>
      </nav>
    </aside>

    <!-- 메인 영역: 페이지별 내용이 들어갈 자리 -->
    <main class="main planner" data-page="todo">
      <h1>할 일</h1>
      <label>상태 <select id="filter"><option value="all">전체</option><option value="open">미완료</option><option value="done">완료</option></select></label>
      <form id="entry"><label>할 일 이름<input id="title" required maxlength="120" autocomplete="off"></label>
      <label>마감일 (선택)<input type="date" id="due"></label>
      <button class="primary">추가</button></form>
      <ul id="items" aria-live="polite"></ul>
    </main>
  </div>
</body>
</html>
