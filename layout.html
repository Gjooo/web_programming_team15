<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LMS 앱 레이아웃</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <style>
    :root {
      /* 앱 배경 */
      --sidebar-bg: #ffffff;
      --main-bg: #dde7f5;

      /* 텍스트 / 아이콘 */
      --text: #2f3440;
      --text-sub: #9097a3;
      --icon: #4b5260;

      /* 활성 메뉴 */
      --active-bg: #d6e3f6;
      --active-text: #2a5aa8;

      /* 아바타 */
      --avatar-bg: #dbe7f8;
      --avatar-icon: #3a6fc6;

      --sidebar-width: 248px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      color: var(--text);
      background: var(--main-bg);
    }

    /* ===== 앱 전체 ===== */
    .app {
      display: flex;
      min-height: 100vh;
      background: var(--main-bg);
    }

    /* ===== 왼쪽 메뉴 ===== */
    .sidebar {
      width: var(--sidebar-width);
      flex-shrink: 0;
      background: var(--sidebar-bg);
      padding: 26px 14px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }

    /* 프로필 */
    .profile {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 8px;
      border: none;
      background: none;
      border-radius: 14px;
      cursor: pointer;
      font: inherit;
      color: inherit;
      text-align: left;
      transition: background .15s;
    }
    .profile:hover { background: #f3f6fb; }

    .avatar {
      width: 46px;
      height: 46px;
      flex-shrink: 0;
      border-radius: 14px;
      background: var(--avatar-bg);
      display: grid;
      place-items: center;
      box-shadow: 0 2px 6px rgba(58, 111, 198, 0.15);
    }
    .avatar svg { width: 28px; height: 28px; fill: var(--avatar-icon); }

    .profile-info { flex: 1; min-width: 0; }
    .profile-name {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .profile-sub {
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 2px;
    }
    .profile .chevron { width: 18px; height: 18px; stroke: var(--icon); }

    /* 메뉴 목록 */
    .nav { display: flex; flex-direction: column; gap: 10px; }

    .nav a {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 52px;
      padding: 0 18px;
      border-radius: 12px;
      color: var(--text);
      text-decoration: none;
      font-size: 17px;
      font-weight: 500;
      transition: background .15s, color .15s;
    }
    .nav a svg {
      width: 24px;
      height: 24px;
      flex-shrink: 0;
      fill: none;
      stroke: var(--icon);
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke .15s;
    }
    .nav a:hover { background: #f1f5fb; }

    .nav a.active {
      background: var(--active-bg);
      color: var(--active-text);
      font-weight: 600;
    }
    .nav a.active svg { stroke: var(--active-text); }

    /* ===== 메인 영역 (페이지별 내용이 들어갈 자리) ===== */
    .main {
      flex: 1;
      min-width: 0;
      padding: 36px 40px;
    }

    /* ===== 반응형 ===== */
    @media (max-width: 960px) {
      :root { --sidebar-width: 84px; }
      .profile-info, .profile .chevron, .nav a span { display: none; }
      .profile { justify-content: center; padding: 6px 0; }
      .nav a { justify-content: center; padding: 0; }
    }

    @media (max-width: 560px) {
      .app { flex-direction: column-reverse; }
      .sidebar {
        width: 100%;
        flex-direction: row;
        padding: 8px 10px;
        gap: 0;
        border-top: 1px solid #e6ebf3;
      }
      .profile { display: none; }
      .nav { flex-direction: row; flex: 1; justify-content: space-around; gap: 4px; }
      .nav a { height: 48px; flex: 1; }
      .main { padding: 24px 16px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <!-- 왼쪽 메뉴 -->
    <aside class="sidebar">
      <button class="profile" type="button" aria-label="계정 메뉴">
        <div class="avatar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="8" r="4.2" />
            <path d="M3.8 20.5c0-4.2 3.7-7 8.2-7s8.2 2.8 8.2 7c0 .6-.4.9-.9.9H4.7c-.5 0-.9-.3-.9-.9z" />
          </svg>
        </div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">이름</div>
          <div class="profile-sub" id="profile-sub">학번</div>
        </div>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m6 9 6 6 6-6" />
        </svg>
      </button>

      <nav class="nav">
        <a href="#dashboard" data-page="dashboard" class="active">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 10.2 12 3.5l8.5 6.7V19a1.5 1.5 0 0 1-1.5 1.5h-4v-6h-6v6H5A1.5 1.5 0 0 1 3.5 19z" />
          </svg>
          <span>대시보드</span>
        </a>
        <a href="#calendar" data-page="calendar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" />
            <path d="M3.5 10h17M8 3v4M16 3v4" />
          </svg>
          <span>캘린더</span>
        </a>
        <a href="#todo" data-page="todo">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4.5H6.5A1.5 1.5 0 0 0 5 6v13.5A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V6a1.5 1.5 0 0 0-1.5-1.5H15" />
            <rect x="9" y="3" width="6" height="3" rx="1" />
            <path d="m8.5 13.5 2.5 2.5 4.5-5" />
          </svg>
          <span>할 일</span>
        </a>
        <a href="#notice" data-page="notice">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3.5 10v4a1 1 0 0 0 1 1H7l7 4.5v-15L7 9H4.5a1 1 0 0 0-1 1z" />
            <path d="M7 15l1.2 4.5a1 1 0 0 0 1 .8h1.3M18 9.5a3.5 3.5 0 0 1 0 5M20.5 7a7 7 0 0 1 0 10" />
          </svg>
          <span>공지사항</span>
        </a>
        <a href="#settings" data-page="settings">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
          </svg>
          <span>설정</span>
        </a>
      </nav>
    </aside>

    <!-- 메인 영역: 페이지별 내용이 들어갈 자리 -->
    <main class="main" id="main"></main>
  </div>

  <script>
    // 해시(#dashboard 등)에 맞춰 메뉴 활성 상태 전환
    const links = document.querySelectorAll('.nav a');

    function setActive() {
      const page = location.hash.slice(1) || 'dashboard';
      links.forEach(a => a.classList.toggle('active', a.dataset.page === page));
    }

    window.addEventListener('hashchange', setActive);
    setActive();
  </script>
</body>
</html>
