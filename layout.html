<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LMS 앱 레이아웃</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <div class="app">
    <!-- 왼쪽 메뉴 -->
    <aside class="sidebar">
      <button class="profile" type="button" aria-label="계정 메뉴">
        <div class="avatar">
          <img src="icons/user.svg" alt="" />
        </div>
        <div class="profile-info">
          <div class="profile-name" id="profile-name">이름</div>
          <div class="profile-sub" id="profile-sub">학번</div>
        </div>
        <img class="chevron" src="icons/chevron-down.svg" alt="" />
      </button>

      <nav class="nav">
        <a href="layout.html" class="active">
          <img src="icons/home.svg" alt="" />
          <span>대시보드</span>
        </a>
        <a href="calendar.html">
          <img src="icons/calendar.svg" alt="" />
          <span>캘린더</span>
        </a>
        <a href="todo.html">
          <img src="icons/todo.svg" alt="" />
          <span>할 일</span>
        </a>
        <a href="notice.html">
          <img src="icons/notice.svg" alt="" />
          <span>공지사항</span>
        </a>
        <a href="settings.html">
          <img src="icons/settings.svg" alt="" />
          <span>설정</span>
        </a>
      </nav>
    </aside>

    <!-- 메인 영역: 페이지별 내용이 들어갈 자리 -->
    <main class="main" id="main"></main>
  </div>
</body>
</html>
